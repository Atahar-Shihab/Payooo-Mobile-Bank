<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c091d"/>
      <stop offset="100%" stop-color="#070513"/>
    </linearGradient>

    <linearGradient id="titleBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b1638"/>
      <stop offset="100%" stop-color="#120e28"/>
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(105, 85, 246, 0.4)"/>
      <stop offset="50%" stop-color="rgba(41, 223, 178, 0.3)"/>
      <stop offset="100%" stop-color="rgba(105, 85, 246, 0.1)"/>
    </linearGradient>

    <filter id="cursorGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulseTerminalGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      .cursor-blink {
        animation: blinkCursor 1s infinite;
      }
      .glow-border {
        animation: pulseTerminalGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="2" y="2" width="956" height="226" rx="16" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5" class="glow-border"/>

  <!-- Titlebar -->
  <path d="M 2 18 A 16 16 0 0 1 18 2 L 942 2 A 16 16 0 0 1 958 18 L 958 42 L 2 42 Z" fill="url(#titleBarGrad)"/>
  <line x1="2" y1="42" x2="958" y2="42" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Traffic Light Window Controls -->
  <g transform="translate(20, 16)">
    <circle cx="6" cy="6" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="26" cy="6" r="6" fill="#ffbd2e" stroke="#dea125" stroke-width="0.5"/>
    <circle cx="46" cy="6" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>
  </g>

  <!-- Terminal Title -->
  <text x="480" y="26" fill="rgba(255, 255, 255, 0.65)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">
    payoo-core-mfs -- node v20.x -- client-side sandbox [Production Ready]
  </text>

  <!-- Live Pulse Dot in Header -->
  <circle cx="925" cy="22" r="4" fill="#29dfb2"/>

  <!-- Terminal Output Lines -->
  <g transform="translate(32, 70)" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12">
    <!-- Command 1 -->
    <text x="0" y="0">
      <tspan fill="#6955f6" font-weight="700">shihab@payoo-node</tspan><tspan fill="#ffffff">:~$ </tspan><tspan fill="#ffd066">payoo-cli --system-check --benchmark</tspan>
    </text>

    <!-- Line 1: Storage -->
    <text x="0" y="24">
      <tspan fill="#29dfb2">✔</tspan>
      <tspan fill="#ffffff" font-weight="600"> [LOCALSTORAGE]</tspan>
      <tspan fill="rgba(255, 255, 255, 0.7)"> Dynamic balance state synced </tspan>
      <tspan fill="#8d7eff">(payoo_current_balance: ৳4,500.00)</tspan>
    </text>

    <!-- Line 2: Remittance -->
    <text x="0" y="46">
      <tspan fill="#29dfb2">✔</tspan>
      <tspan fill="#ffffff" font-weight="600"> [REMITTANCE] </tspan>
      <tspan fill="rgba(255, 255, 255, 0.7)"> Bangladesh Bank 2.5% Cash Incentive module enabled </tspan>
      <tspan fill="#f5a049">(USD/EUR/GBP/SAR/AED)</tspan>
    </text>

    <!-- Line 3: Omnibox & Shortcuts -->
    <text x="0" y="68">
      <tspan fill="#29dfb2">✔</tspan>
      <tspan fill="#ffffff" font-weight="600"> [DISPATCHER] </tspan>
      <tspan fill="rgba(255, 255, 255, 0.7)"> Omnibox palette loaded with fuzzy navigation </tspan>
      <tspan fill="#38bdf8">(Ctrl+K / Cmd+K / Slash key)</tspan>
    </text>

    <!-- Line 4: Security Sandbox -->
    <text x="0" y="90">
      <tspan fill="#29dfb2">✔</tspan>
      <tspan fill="#ffffff" font-weight="600"> [SECURITY]   </tspan>
      <tspan fill="rgba(255, 255, 255, 0.7)"> Client-side PIN validation, DOM sanitize &amp; PWA Service Worker cached</tspan>
    </text>

    <!-- Active Prompt with Blinking Cursor -->
    <text x="0" y="118">
      <tspan fill="#6955f6" font-weight="700">shihab@payoo-node</tspan><tspan fill="#ffffff">:~$ </tspan>
      <tspan fill="#29dfb2">payoo --launch --demo</tspan>
      <tspan fill="rgba(255, 255, 255, 0.5)"> --url https://atahar-shihab.github.io/Payooo-Mobile-Bank/</tspan>
      <tspan fill="#29dfb2" class="cursor-blink" filter="url(#cursorGlow)"> █</tspan>
    </text>
  </g>
</svg>