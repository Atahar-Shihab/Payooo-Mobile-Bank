<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 130" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191538" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0e0b24" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Top Glow Border Gradients -->
    <linearGradient id="glowLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29dfb2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#29dfb2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#29dfb2" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6955f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8d7eff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6955f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowLine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a049" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd066" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f5a049" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowLine4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="statSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="45%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Filter for glows -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes sweepLight {
        0% { transform: translateX(-300px) skewX(-20deg); }
        35%, 100% { transform: translateX(1200px) skewX(-20deg); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .sweep-beam {
        animation: sweepLight 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .pulse-line {
        animation: pulseAura 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- CARD 1: P2P Fee -->
  <g transform="translate(15, 8)">
    <rect width="220" height="114" rx="14" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <!-- Top glowing accent border -->
    <rect x="25" y="0" width="170" height="2" rx="1" fill="url(#glowLine1)" class="pulse-line" filter="url(#cardGlow)"/>
    
    <!-- Icon & Status -->
    <g transform="translate(16, 18)">
      <rect width="32" height="32" rx="8" fill="rgba(41, 223, 178, 0.14)" stroke="rgba(41, 223, 178, 0.3)"/>
      <!-- Swap Arrow Icon -->
      <path d="M 11 13 L 21 13 M 17 9 L 21 13 L 17 17 M 21 19 L 11 19 M 15 15 L 11 19 L 15 23" fill="none" stroke="#29dfb2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      
      <circle cx="180" cy="16" r="4" fill="#29dfb2"/>
      <text x="170" y="19" fill="#29dfb2" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" text-anchor="end">LIVE</text>
    </g>

    <!-- Value & Label -->
    <text x="16" y="78" fill="#ffffff" font-family="'Manrope', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">৳0.00 Fee</text>
    <text x="16" y="98" fill="rgba(255, 255, 255, 0.65)" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500">Zero-fee instant P2P transfer</text>
  </g>

  <!-- CARD 2: Mobile Recharge -->
  <g transform="translate(251, 8)">
    <rect width="220" height="114" rx="14" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <!-- Top glowing accent border -->
    <rect x="25" y="0" width="170" height="2" rx="1" fill="url(#glowLine2)" class="pulse-line" filter="url(#cardGlow)"/>
    
    <!-- Icon & Status -->
    <g transform="translate(16, 18)">
      <rect width="32" height="32" rx="8" fill="rgba(105, 85, 246, 0.18)" stroke="rgba(139, 124, 255, 0.35)"/>
      <!-- Phone / Signal Icon -->
      <rect x="11" y="8" width="10" height="16" rx="2" fill="none" stroke="#9d8eff" stroke-width="1.6"/>
      <line x1="14" y1="21" x2="18" y2="21" stroke="#9d8eff" stroke-width="1.6" stroke-linecap="round"/>
      
      <text x="180" y="19" fill="#9d8eff" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" text-anchor="end">4G / 5G</text>
    </g>

    <!-- Value & Label -->
    <text x="16" y="78" fill="#ffffff" font-family="'Manrope', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">5 Operators</text>
    <text x="16" y="98" fill="rgba(255, 255, 255, 0.65)" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500">GP, Robi, BL, Airtel, Teletalk</text>
  </g>

  <!-- CARD 3: Govt Remittance -->
  <g transform="translate(487, 8)">
    <rect width="220" height="114" rx="14" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <!-- Top glowing accent border -->
    <rect x="25" y="0" width="170" height="2" rx="1" fill="url(#glowLine3)" class="pulse-line" filter="url(#cardGlow)"/>
    
    <!-- Icon & Status -->
    <g transform="translate(16, 18)">
      <rect width="32" height="32" rx="8" fill="rgba(245, 160, 73, 0.16)" stroke="rgba(245, 160, 73, 0.35)"/>
      <!-- Globe / Coins Icon -->
      <circle cx="16" cy="16" r="7" fill="none" stroke="#f5a049" stroke-width="1.6"/>
      <ellipse cx="16" cy="16" rx="3.5" ry="7" fill="none" stroke="#f5a049" stroke-width="1.2"/>
      <line x1="9" y1="16" x2="23" y2="16" stroke="#f5a049" stroke-width="1.2"/>
      
      <text x="180" y="19" fill="#f5a049" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" text-anchor="end">GOVT BD</text>
    </g>

    <!-- Value & Label -->
    <text x="16" y="78" fill="#ffffff" font-family="'Manrope', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">+2.5% Bonus</text>
    <text x="16" y="98" fill="rgba(255, 255, 255, 0.65)" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500">Legal remittance incentive</text>
  </g>

  <!-- CARD 4: Security / Sandbox -->
  <g transform="translate(723, 8)">
    <rect width="220" height="114" rx="14" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <!-- Top glowing accent border -->
    <rect x="25" y="0" width="170" height="2" rx="1" fill="url(#glowLine4)" class="pulse-line" filter="url(#cardGlow)"/>
    
    <!-- Icon & Status -->
    <g transform="translate(16, 18)">
      <rect width="32" height="32" rx="8" fill="rgba(56, 189, 248, 0.16)" stroke="rgba(56, 189, 248, 0.35)"/>
      <!-- Shield / Safe Icon -->
      <path d="M 16 9 L 23 12 V 17 C 23 21 16 24 16 24 C 16 24 9 21 9 17 V 12 Z" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M 13 16 L 15 18 L 19 14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <text x="180" y="19" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" text-anchor="end">SECURE</text>
    </g>

    <!-- Value & Label -->
    <text x="16" y="78" fill="#ffffff" font-family="'Manrope', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">100% Client</text>
    <text x="16" y="98" fill="rgba(255, 255, 255, 0.65)" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500">Reactive LocalStorage sandbox</text>
  </g>

  <!-- Lighting Sweep Beam across all cards -->
  <rect x="-300" y="0" width="120" height="130" fill="url(#statSweep)" class="sweep-beam" pointer-events="none"/>
</svg>