<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Radial & Linear Gradients -->
    <radialGradient id="bgGlow" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#34228a" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#181340" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080716" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="laserGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#29dfb2" stop-opacity="1"/>
      <stop offset="50%" stop-color="#6955f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6955f6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1d6e"/>
      <stop offset="50%" stop-color="#4934bd"/>
      <stop offset="100%" stop-color="#14112e"/>
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>

    <linearGradient id="laserStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6955f6"/>
      <stop offset="50%" stop-color="#29dfb2"/>
      <stop offset="100%" stop-color="#ff7399"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="45%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes laserCycle {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -2560; }
      }
      @keyframes sweepAnimation {
        0% { transform: translateX(-400px) rotate(25deg); }
        35%, 100% { transform: translateX(1100px) rotate(25deg); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-1deg); }
      }
      @keyframes orbitRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes beamGlow {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 8px #29dfb2); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px #6955f6); }
      }

      .laser-border {
        stroke-dasharray: 180 460;
        animation: laserCycle 8s linear infinite;
      }
      .sweep-light {
        animation: sweepAnimation 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .status-pulse {
        animation: pulseDot 2s ease-in-out infinite;
      }
      .floating-card-group {
        animation: floatCard 5s ease-in-out infinite;
        transform-origin: 750px 160px;
      }
      .live-beam {
        animation: beamGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="320" rx="24" fill="url(#bgGlow)"/>

  <!-- Perspective Ambient Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="960" y2="40"/>
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="200" x2="960" y2="200"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="560" y1="0" x2="560" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="880" y1="0" x2="880" y2="320"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="750" cy="140" r="140" fill="url(#laserGlow)" opacity="0.28"/>
  <circle cx="160" cy="220" r="100" fill="#6955f6" opacity="0.15" filter="url(#neonFilter)"/>

  <!-- Running Edge Laser Light Border -->
  <rect x="2" y="2" width="956" height="316" rx="22" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <rect x="2" y="2" width="956" height="316" rx="22" fill="none" stroke="url(#laserStroke)" stroke-width="3" class="laser-border" filter="url(#softGlow)"/>

  <!-- Left Side: Brand & Hero Typography -->
  <g transform="translate(60, 48)">
    <!-- Pill Badge with Pulsing Live Status -->
    <g transform="translate(0, 0)">
      <rect width="280" height="28" rx="14" fill="rgba(105, 85, 246, 0.22)" stroke="rgba(139, 124, 255, 0.4)" stroke-width="1"/>
      <circle cx="15" cy="14" r="5" fill="#29dfb2" class="status-pulse" filter="url(#softGlow)"/>
      <text x="28" y="18" fill="#30dfb4" font-family="'DM Sans', -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">FINTECH SUPER-APP · BANGLADESH</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" fill="#ffffff" font-family="'Manrope', -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">pay<tspan fill="#8d7eff">oo</tspan> <tspan font-size="28" font-weight="600" fill="#b9afff">Mobile Bank</tspan></text>
      <text x="0" y="32" fill="#29dfb2" font-family="'Manrope', -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5" class="live-beam">Your money, in cinematic motion.</text>
    </g>

    <!-- Description -->
    <text x="0" y="140" fill="rgba(255, 255, 255, 0.72)" font-family="'DM Sans', -apple-system, sans-serif" font-size="14" font-weight="400" line-height="1.5">
      <tspan x="0" dy="0">Instant P2P transfers with zero fees, 5-network mobile recharge, utility</tspan>
      <tspan x="0" dy="22">bill payments, dynamic 7-day flow analytics, and QR payment engine.</tspan>
    </text>

    <!-- Live Badges -->
    <g transform="translate(0, 192)">
      <g transform="translate(0, 0)">
        <rect width="130" height="26" rx="8" fill="rgba(41, 223, 178, 0.14)" stroke="rgba(41, 223, 178, 0.3)"/>
        <text x="12" y="17" fill="#29dfb2" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700">✓ 0% Transfer Fee</text>
      </g>
      <g transform="translate(140, 0)">
        <rect width="130" height="26" rx="8" fill="rgba(105, 85, 246, 0.18)" stroke="rgba(139, 124, 255, 0.35)"/>
        <text x="12" y="17" fill="#b8aeff" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700">✦ Dark &amp; Light Mode</text>
      </g>
      <g transform="translate(280, 0)">
        <rect width="135" height="26" rx="8" fill="rgba(245, 160, 73, 0.16)" stroke="rgba(245, 160, 73, 0.35)"/>
        <text x="12" y="17" fill="#f5a049" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700">⚡ 2.5% Remittance</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Glowing Holographic 3D Card -->
  <g class="floating-card-group" transform="translate(710, 160)">
    <!-- Card Drop Shadow & Glow -->
    <rect x="-140" y="-88" width="280" height="176" rx="18" fill="rgba(10, 8, 28, 0.7)" filter="url(#neonFilter)"/>

    <!-- Orbital Ring 1 -->
    <ellipse cx="0" cy="0" rx="170" ry="70" fill="none" stroke="rgba(105, 85, 246, 0.4)" stroke-width="1.2" stroke-dasharray="8 6" transform="rotate(-15)"/>
    <!-- Orbital Ring 2 -->
    <ellipse cx="0" cy="0" rx="185" ry="50" fill="none" stroke="rgba(41, 223, 178, 0.35)" stroke-width="1" stroke-dasharray="14 10" transform="rotate(22)"/>

    <!-- The Holographic Card Mesh -->
    <g transform="rotate(-6)">
      <!-- Card Body -->
      <rect x="-135" y="-85" width="270" height="170" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>

      <!-- Card Glowing Rim -->
      <rect x="-135" y="-85" width="270" height="170" rx="16" fill="none" stroke="url(#laserStroke)" stroke-width="1.5" opacity="0.6"/>

      <!-- Card Top: Logo & Contactless -->
      <text x="-115" y="-55" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="16" font-weight="800">pay<tspan fill="#9c8cff">oo</tspan></text>
      <text x="-115" y="-40" fill="rgba(255, 255, 255, 0.6)" font-family="'DM Sans', sans-serif" font-size="7" font-weight="800" letter-spacing="1">PLATINUM DIGITAL</text>

      <!-- Contactless Wave Icon -->
      <path d="M 105 -58 A 6 6 0 0 1 105 -48 M 110 -62 A 11 11 0 0 1 110 -44 M 115 -66 A 16 16 0 0 1 115 -40" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>

      <!-- EMV Gold Chip -->
      <rect x="-115" y="-20" width="34" height="26" rx="4" fill="url(#chipGrad)" stroke="#d49b00" stroke-width="0.8"/>
      <path d="M -115 -7 L -81 -7 M -98 -20 L -98 6" stroke="rgba(100, 60, 0, 0.4)" stroke-width="1"/>

      <!-- Holographic Taka Symbol (৳) -->
      <circle cx="105" cy="-7" r="14" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="105" y="-2" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="15" font-weight="800" text-anchor="middle">৳</text>

      <!-- Card Number -->
      <text x="-115" y="32" fill="#ffffff" font-family="'DM Sans', monospace" font-size="13" font-weight="700" letter-spacing="2">••••  ••••  ••••  9184</text>

      <!-- Cardholder & Expiry -->
      <text x="-115" y="58" fill="rgba(255, 255, 255, 0.55)" font-family="'DM Sans', sans-serif" font-size="6.5" font-weight="700" letter-spacing="1">CARDHOLDER</text>
      <text x="-115" y="69" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="9" font-weight="800" letter-spacing="0.5">SHIHAB ATAHAR</text>

      <text x="75" y="58" fill="rgba(255, 255, 255, 0.55)" font-family="'DM Sans', sans-serif" font-size="6.5" font-weight="700" letter-spacing="1">EXPIRES</text>
      <text x="75" y="69" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="9" font-weight="800">10/29</text>
    </g>
  </g>

  <!-- Live Shimmer Lighting Sweep across Banner -->
  <rect x="-400" y="-50" width="160" height="420" fill="url(#shimmer)" class="sweep-light" pointer-events="none"/>
</svg>
